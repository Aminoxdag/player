<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VLC Ultimate Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --vlc-orange: #ff9500; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; color: white; font-family: system-ui, -apple-system, sans-serif; }
        
        #playerContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        #mainVideo {
            width: 100% !important;
            height: 100% !important;
            transition: object-fit 0.2s ease;
            display: block;
        }

        .fit-contain { object-fit: contain !important; } 
        .fit-fill { object-fit: fill !important; }        
        .fit-cover { object-fit: cover !important; }     

        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(rgba(0,0,0,0.85) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.92) 100%);
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .ui-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px;
            z-index: 1001;
        }

        .url-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            width: 100%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .library-btn, .upload-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 149, 0, 0.2);
            color: var(--vlc-orange);
            border-radius: 50%;
            border: 1px solid rgba(255, 149, 0, 0.3);
            margin-left: 8px;
            flex-shrink: 0;
            transition: 0.2s;
            cursor: pointer;
        }
        .library-btn:active, .upload-btn:active { transform: scale(0.9); background: var(--vlc-orange); color: black; }

        .url-input {
            background: transparent;
            flex: 1;
            font-size: 13px;
            outline: none;
            border: none;
            text-align: right;
            color: white;
            padding: 0 10px;
        }

        .play-action-btn {
            background: var(--vlc-orange);
            color: black;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .play-action-btn:active { transform: scale(0.95); opacity: 0.9; }

        .search-results {
            position: absolute;
            top: 115%;
            left: 10px;
            right: 10px;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .search-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            text-align: right;
            color: #ddd;
        }
        .search-item:hover { background: var(--vlc-orange); color: black; font-weight: 600; }

        .seek-container {
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            direction: ltr !important; 
        }

        .seek-bar {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            position: relative;
        }

        #progFill {
            height: 100%;
            background: var(--vlc-orange);
            width: 0%;
            border-radius: 10px;
            position: absolute;
            left: 0;
            top: 0;
        }

        #progFill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
        }

        .badge-aspect {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-skip, .btn-frame, .btn-capture {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .btn-skip i, .btn-frame i, .btn-capture i { font-size: 20px; margin-bottom: 3px; }
        .btn-skip:active, .btn-frame:active, .btn-capture:active { transform: scale(0.9); color: var(--vlc-orange); }
        
        .notification {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--vlc-orange);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

<div id="playerContainer">
    <!-- Main Video Player Element -->
    <!-- crossOrigin set to anonymous to allow snapshot/canvas operations on remote URLs when supported -->
    <video id="mainVideo" class="fit-contain" playsinline webkit-playsinline crossorigin="anonymous">
    </video>

    <!-- UI Overlay Layer -->
    <div id="ui" class="ui-overlay">
        <!-- Top Search & Actions Bar -->
        <div class="p-4 pt-6 flex flex-col items-center gap-4">
            <div class="search-wrapper">
                <div class="url-box">
                    <!-- Library Button -->
                    <button onclick="window.open('https://aminoxdag.github.io/BLACKED-POMF/', '_blank')" class="library-btn" title="المكتبة">
                        <i class="fas fa-th-large"></i>
                    </button>
                    
                    <!-- Upload From Album Button -->
                    <label class="upload-btn" title="رفع فيديو من جهازك">
                        <input type="file" id="localVideoFile" accept="video/*" class="hidden" onchange="loadLocalVideo(this)">
                        <i class="fas fa-file-import"></i>
                    </label>
                    
                    <!-- Search Input -->
                    <input type="text" id="videoUrl" 
                           class="url-input"
                           placeholder="ابحث، الصق رابطاً مباشرًا، أو ارفع ملفاً..." 
                           autocomplete="off">
                    
                    <!-- Play Button -->
                    <button id="mainActionBtn" onclick="updateSource()" class="play-action-btn">تشغيل</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
            
            <!-- Context options -->
            <div class="w-full flex justify-between items-center px-4">
                <div class="text-[10px] font-bold tracking-[2px] opacity-30 uppercase">Professional Cinema</div>
                <div class="flex gap-4 items-center">
                    <div onclick="cycleAspect()" class="badge-aspect" id="aspectLabel">وضع العرض: FIT</div>
                    <button onclick="toggleLock()" class="text-white/60 text-xl"><i id="lockIcon" class="fas fa-unlock"></i></button>
                </div>
            </div>
        </div>

        <!-- Notification Message Pop-up -->
        <div id="toastNotification" class="notification">تم الحفظ بنجاح!</div>

        <!-- Bottom Controls Bar -->
        <div class="p-6">
            <!-- Timeline details -->
            <div class="flex justify-between text-[12px] font-mono mb-2 px-1 opacity-70" dir="ltr">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
            </div>

            <!-- Seek Slider container -->
            <div class="seek-container" id="seekWrapper">
                <div class="seek-bar">
                    <div id="progFill"></div>
                </div>
            </div>

            <!-- Functional Playback Keys -->
            <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between mt-5 gap-4">
                
                <!-- Left Playback & Navigation Block -->
                <div class="flex items-center justify-between md:justify-start gap-6 md:gap-10">
                    <!-- Main Play Action -->
                    <button onclick="togglePlay()" id="playBtnSmall" class="text-4xl text-white hover:text-orange-400 transition transform active:scale-90">
                        <i class="fas fa-play"></i>
                    </button>
                    <!-- Quick Seek Buttons -->
                    <button onclick="skip(-10)" class="btn-skip"><i class="fas fa-backward"></i><span>10- ثوانٍ</span></button>
                    <button onclick="skip(10)" class="btn-skip"><i class="fas fa-forward"></i><span>10+ ثوانٍ</span></button>
                </div>

                <!-- Frame-by-Frame Controls & Frame Capturing (NEW) -->
                <div class="flex items-center justify-center gap-6 border-y md:border-y-0 border-white/10 py-3 md:py-0">
                    <!-- Previous Frame -->
                    <button onclick="stepFrame(-1)" class="btn-frame" title="الإطار السابق">
                        <i class="fas fa-chevron-left"></i>
                        <span>إطار خلف</span>
                    </button>
                    
                    <!-- Save current frame as PNG -->
                    <button onclick="captureCurrentFrame()" class="btn-capture bg-orange-500/10 border border-orange-500/30 text-orange-400 px-4 py-2 rounded-xl" title="حفظ اللقطة الحالية كـ PNG">
                        <i class="fas fa-camera text-xl mb-1 text-orange-500"></i>
                        <span class="font-bold text-[11px]">حفظ إطار PNG</span>
                    </button>

                    <!-- Next Frame -->
                    <button onclick="stepFrame(1)" class="btn-frame" title="الإطار التالي">
                        <i class="fas fa-chevron-right"></i>
                        <span>إطار أمام</span>
                    </button>
                </div>

                <!-- Right Aspect/Speed/PIP/Fullscreen Configuration block -->
                <div class="flex items-center justify-between md:justify-end gap-6 md:gap-7">
                    <!-- Playback Speed -->
                    <select onchange="video.playbackRate = parseFloat(this.value)" class="bg-white/10 text-[11px] border border-white/10 rounded-full px-4 py-1.5 outline-none cursor-pointer">
                        <option value="1">1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                        <option value="0.5">0.5x (بطيء)</option>
                        <option value="0.25">0.25x (بطيء جداً)</option>
                    </select>

                    <!-- Picture In Picture Toggle -->
                    <button id="pipBtn" onclick="togglePIP()" title="صورة داخل صورة" class="text-white/70 text-2xl hover:text-orange-500 transition">
                        <i class="fas fa-window-restore"></i>
                    </button>

                    <!-- Fullscreen Screen Switch -->
                    <button onclick="requestFullScreen()" class="text-orange-500 text-3xl hover:scale-110 transition active:scale-95">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const ui = document.getElementById('ui');
    const progFill = document.getElementById('progFill');
    const seekWrapper = document.getElementById('seekWrapper');
    const aspectLabel = document.getElementById('aspectLabel');
    const urlInput = document.getElementById('videoUrl');
    const searchResults = document.getElementById('searchResults');
    const pipBtn = document.getElementById('pipBtn');
    const toastNotification = document.getElementById('toastNotification');
    
    let hideTimer;
    let aspectIndex = 0; 
    let isLocked = false;
    let videoLinks = [];
    let isTyping = false; 

    // FPS configuration used for precise Frame by Frame navigation
    const DEFAULT_FPS = 25; // Standard fallback FPS

    // Fetch library link items
    async function fetchLinks() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/Aminoxdag/My-links/refs/heads/main/cytube_links.txt');
            const text = await response.text();
            videoLinks = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        } catch (e) { console.error("Data fetch error"); }
    }
    fetchLinks();

    window.onload = function() {
        const videoUrlFromHash = decodeURIComponent(window.location.hash.substring(1));
        if (videoUrlFromHash && videoUrlFromHash.startsWith('http')) {
            urlInput.value = videoUrlFromHash;
            updateSource();
        }
    }

    urlInput.onfocus = () => { 
        isTyping = true; 
        clearTimeout(hideTimer); 
        ui.classList.remove('ui-hidden'); 
    };
    urlInput.onblur = () => { 
        isTyping = false; 
        setTimeout(() => { searchResults.style.display = 'none'; }, 200);
        showUI(); 
    };

    urlInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (query.length === 0) { searchResults.style.display = 'none'; return; }

        if (query.startsWith('http')) {
            searchResults.style.display = 'none';
            return;
        }

        const matches = videoLinks.filter(l => l.toLowerCase().includes(query)).slice(0, 15);
        if (matches.length > 0) {
            searchResults.innerHTML = matches.map(fullLink => {
                let displayName = fullLink.replace(/https?:\/\/cdn\.cinema-blue\.icu\/blk\//gi, '').replace(/%20/g, ' ');
                return `<div class="search-item" onclick="selectResult('${fullLink}')">${displayName}</div>`;
            }).join('');
            searchResults.style.display = 'block';
        } else { searchResults.style.display = 'none'; }
    });

    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            updateSource();
            urlInput.blur();
        }
    });

    function selectResult(fullLink) {
        urlInput.value = fullLink;
        searchResults.style.display = 'none';
        updateSource();
    }

    // Load Local files from Gallery / Album (NEW Feature)
    function loadLocalVideo(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const fileURL = URL.createObjectURL(file);
            
            // Update input label representation and play
            urlInput.value = `ملف محلي: ${file.name}`;
            video.src = fileURL;
            video.load();
            video.play().then(() => {
                document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>';
                showNotification("تم تحميل وتشغيل الفيديو بنجاح");
            }).catch(e => {
                console.log("Local playback error: ", e);
            });
            showUI();
        }
    }

    // Precise Frame-by-Frame stepping (NEW Feature)
    function stepFrame(framesCount) {
        if (!video.duration) return;
        
        // Pause the video if playing to allow precise inspection
        if (!video.paused) {
            video.pause();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-play"></i>';
        }

        // Calculate single frame duration (defaulting to ~40ms if FPS unknown)
        const frameTime = 1 / DEFAULT_FPS;
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (framesCount * frameTime)));
        showUI();
    }

    // Capture Exact Frame and Save to Gallery as PNG (NEW Feature)
    function captureCurrentFrame() {
        if (!video.duration || video.readyState < 2) {
            showNotification("خطأ: يرجى تشغيل مقطع فيديو أولاً لالتقاط اللقطة!");
            return;
        }

        try {
            // Create a virtual Canvas holding the video's actual resolution
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            // Draw current frame onto the canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Export canvas as highly compatible PNG
            // If the video source is local or has CORS allowance, this succeeds. 
            // In case of remote CORS limitations, it prompts a clean notification.
            const dataUrl = canvas.toDataURL('image/png');
            
            // Create temporal anchor element to download locally
            const downloadLink = document.createElement('a');
            const videoName = urlInput.value.split('/').pop().replace(/[^a-zA-Z0-9]/g, '_') || "vlc_frame";
            const timestamp = Math.floor(video.currentTime * 100) / 100;
            
            downloadLink.download = `VLC_Capture_${videoName}_${timestamp}s.png`;
            downloadLink.href = dataUrl;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            showNotification("تم حفظ لقطة الإطار الحالي كـ PNG!");
        } catch (error) {
            console.error(error);
            showNotification("تنبيه: لا يمكن حفظ الصور من روابط خارجية تمنع مشاركة الموارد (CORS). يرجى تجربة ملف محلي!");
        }
    }

    // Custom Toast Notification system
    function showNotification(msg) {
        toastNotification.innerText = msg;
        toastNotification.style.opacity = '1';
        setTimeout(() => {
            toastNotification.style.opacity = '0';
        }, 3500);
    }

    function showUI() {
        if (isLocked || isTyping) return;
        ui.classList.remove('ui-hidden');
        clearTimeout(hideTimer);
        if (!video.paused) hideTimer = setTimeout(() => {
            if (!isTyping) ui.classList.add('ui-hidden');
        }, 3000);
    }

    document.getElementById('playerContainer').addEventListener('mousemove', showUI);
    document.getElementById('playerContainer').addEventListener('touchstart', showUI);

    function togglePlay() {
        if (video.paused) {
            video.play();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            video.pause();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-play"></i>';
        }
        showUI();
    }

    video.addEventListener('click', togglePlay);

    video.ontimeupdate = () => {
        const percent = (video.currentTime / video.duration) * 100;
        progFill.style.width = percent + '%';
        document.getElementById('currentTime').innerText = formatTime(video.currentTime);
        document.getElementById('durationTime').innerText = formatTime(video.duration || 0);
    };

    function formatTime(s) {
        let m = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return (m < 10 ? '0'+m : m) + ":" + (sec < 10 ? '0'+sec : sec);
    }

    function seek(e) {
        const rect = seekWrapper.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const x = clientX - rect.left;
        let pos = x / rect.width;
        if (pos < 0) pos = 0; if (pos > 1) pos = 1;
        video.currentTime = pos * video.duration;
    }

    seekWrapper.onmousedown = (e) => {
        seek(e);
        window.onmousemove = seek;
        window.onmouseup = () => window.onmousemove = null;
    };
    seekWrapper.ontouchmove = seek;

    function cycleAspect() {
        aspectIndex = (aspectIndex + 1) % 3;
        video.className = '';
        if (aspectIndex === 0) { video.classList.add('fit-contain'); aspectLabel.innerText = "وضع العرض: FIT"; }
        else if (aspectIndex === 1) { video.classList.add('fit-fill'); aspectLabel.innerText = "وضع العرض: STRETCH"; }
        else if (aspectIndex === 2) { video.classList.add('fit-cover'); aspectLabel.innerText = "وضع العرض: ZOOM"; }
        showUI();
    }

    function updateSource() {
        const url = urlInput.value.trim();
        if (url && !url.startsWith("ملف محلي:")) {
            video.src = url;
            video.load();
            video.play().then(() => {
                document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(e => console.log("Auto-play blocked or error"));
            showUI();
        }
    }

    async function togglePIP() {
        try {
            if (video !== document.pictureInPictureElement) await video.requestPictureInPicture();
            else await document.exitPictureInPicture();
        } catch (e) { console.error("PIP Error"); }
    }

    function requestFullScreen() {
        const container = document.getElementById('playerContainer');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                });
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        } else {
            document.exitFullscreen();
        }
    }

    function skip(val) {
        video.currentTime += val;
        showUI();
    }

    function toggleLock() {
        isLocked = !isLocked;
        document.getElementById('lockIcon').className = isLocked ? "fas fa-lock text-orange-500" : "fas fa-unlock";
        if (isLocked) ui.classList.add('ui-hidden');
        else showUI();
    }

    video.onloadedmetadata = () => {
        document.getElementById('durationTime').innerText = formatTime(video.duration);
    };

    window.onkeydown = (e) => {
        if (document.activeElement === urlInput) return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'KeyF') requestFullScreen();
        if (e.code === 'KeyP') togglePIP();
        if (e.code === 'ArrowRight') skip(10);
        if (e.code === 'ArrowLeft') skip(-10);
        // Added Keyboard shortcuts for frame progression
        if (e.code === 'BracketLeft') stepFrame(-1);  // "[" for previous frame
        if (e.code === 'BracketRight') stepFrame(1);  // "]" for next frame
        if (e.code === 'KeyS') captureCurrentFrame(); // "S" for screenshot save
    };
</script>
</body>
</html>
