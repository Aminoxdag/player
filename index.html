<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>VLC Ultimate Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--a:#ff9f0a;--a2:#ff6a00;--ag:rgba(255,149,0,.5);--t:env(safe-area-inset-top,0px);--r:env(safe-area-inset-right,0px);--b:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:Tajawal,system-ui,sans-serif}
button,input{font-family:inherit;color:inherit}button{border:0;padding:0;background:none;cursor:pointer}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
#playerContainer{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
#mainVideo{position:absolute;inset:0;width:100%;height:100%;display:block}
.fit-contain{object-fit:contain}.fit-fill{object-fit:fill}.fit-cover{object-fit:cover}
.aurora{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#1d1536,#07070c 70%);transition:opacity .8s}
.aurora i{position:absolute;border-radius:50%;}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:radial-gradient(circle,rgba(255,149,0,.55),transparent 65%)}
.aurora i:nth-child(2){width:55vmax;height:55vmax;right:-18vmax;bottom:-18vmax;background:radial-gradient(circle,rgba(110,80,255,.55),transparent 65%);animation-delay:-5s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:30%;top:35%;background:radial-gradient(circle,rgba(0,200,200,.3),transparent 65%);animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.has-video .aurora{opacity:0}
#vignette{position:absolute;inset:0;z-index:5;pointer-events:none;--v:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,var(--v)) 100%)}

/* ===== Liquid glass ===== */
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 50%,rgba(255,255,255,.12)),rgba(18,20,30,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),0 8px 22px rgba(0,0,0,.35)}
#playerContainer:not(.live) .glass{-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);background-color:rgba(18,20,30,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.06) 32%,rgba(255,255,255,0) 62%,rgba(255,255,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.gb{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s}
.gb:active{transform:scale(.88)}
@media (hover:hover){.gb:hover{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.12))}}
.gb.flat{background:none;box-shadow:none}.gb.flat:active{background:rgba(255,255,255,.16)}
.gb.on{color:#ffc46b;background:linear-gradient(180deg,rgba(255,159,10,.4),rgba(255,106,0,.16));box-shadow:inset 0 1px 0 rgba(255,210,150,.6),0 0 14px var(--ag)}
.gb.big{--s:46px}.gb.big .ic{width:23px;height:23px}.gb small{position:absolute;font:700 8.5px/1 Tajawal;inset:0;display:grid;place-items:center;padding-top:1px;pointer-events:none}
.gb.sk .ic{width:30px;height:30px}
.play{--s:64px;background:radial-gradient(circle at 30% 18%,#ffd9a0,var(--a) 45%,var(--a2));box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 6px rgba(160,50,0,.4),0 8px 26px var(--ag);color:#fff}
.play .ic{width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(120,40,0,.5))}
.go{background:radial-gradient(circle at 30% 18%,#ffd9a0,var(--a) 50%,var(--a2));color:#fff}
.round{border-radius:50%;width:40px;height:40px;display:grid;place-items:center}

/* ===== UI ===== */
#ui{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:var(--t) var(--r) var(--b) var(--l)}
.scrim{position:absolute;left:0;right:0;z-index:-1;transition:opacity .45s}
.scrim.t{top:0;height:34%;background:linear-gradient(rgba(0,0,0,.6),transparent)}.scrim.b{bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.7))}
#ui .glass{transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1),visibility .4s;pointer-events:auto}
#ui.ui-hidden .scrim{opacity:0}#ui.ui-hidden .glass{opacity:0;visibility:hidden;transform:translateY(-14px) scale(.98)}#ui.ui-hidden .dock{transform:translateY(20px) scale(.98)}
.topbar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px 0}
.sw-wrap{width:100%;max-width:700px;position:relative}
.url-box{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;width:100%;min-width:0}
.url-box:focus-within{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px rgba(255,159,10,.55),0 14px 40px rgba(0,0,0,.4)}
.vsep{width:1px;height:22px;background:rgba(255,255,255,.2);flex:none;margin:0 2px}
.url-input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:0 6px;text-overflow:ellipsis}
.url-input::placeholder{color:rgba(255,255,255,.55)}
.res{position:absolute;top:calc(100% + 10px);left:0;right:0;max-height:min(300px,40dvh);overflow:auto;border-radius:24px;padding:6px;display:none;pointer-events:auto;background:rgba(18,20,30,.92);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.si{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;cursor:pointer;font-size:13.5px;color:#e6e6ee}
.si span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.si .ic{color:var(--a);width:18px;height:18px}
@media (hover:hover){.si:hover{background:rgba(255,255,255,.12)}}.si:active{background:rgba(255,159,10,.3)}
.subrow{display:flex;gap:8px;width:100%;max-width:700px;justify-content:space-between;align-items:center}
.badge{height:38px;padding:0 16px 0 14px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;cursor:pointer}
.badge .ic{width:17px;height:17px;color:var(--a)}

.bottom{position:relative;width:100%;max-width:1040px;margin:0 auto;padding:0 12px 12px}
.dock{border-radius:32px;padding:10px 14px 12px}
.times{display:flex;justify-content:space-between;direction:ltr;font:500 12.5px/1 Tajawal;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;padding:2px 10px 0}
.seek-container{position:relative;height:38px;display:flex;align-items:center;direction:ltr;cursor:pointer;touch-action:none}
.seek-bar{position:relative;width:calc(100% - 16px);margin:0 8px;height:6px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.12);transition:height .15s}
.seek-container.drag .seek-bar{height:10px}
#bufFill,#progFill{position:absolute;left:0;top:0;height:100%;border-radius:99px}
#bufFill{width:0;background:rgba(255,255,255,.28)}
#progFill{width:0;background:linear-gradient(90deg,#ffc46b,var(--a) 50%,var(--a2));box-shadow:0 0 14px var(--ag)}
#progFill::after{content:"";position:absolute;right:-11px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#f0f0f6 55%,#c9cad6);box-shadow:0 0 0 1px rgba(255,255,255,.7),0 3px 10px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.15);transition:transform .15s}
.drag #progFill::after{transform:scale(1.35)}
#pvBox{position:absolute;bottom:46px;left:0;width:176px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .15s;text-align:center;z-index:5}
#pvBox.show{opacity:1}
#pvCanvas{width:176px;display:block;background:#111;border-radius:16px;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 10px 34px rgba(0,0,0,.7)}
#pvTime{display:inline-block;margin-top:6px;font:700 12px Tajawal;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.6);}
.ctrl-wrap{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 4px}
.grp{display:flex;align-items:center;gap:2px}
.grp.main{order:-1;flex:0 0 100%;justify-content:center;gap:clamp(6px,3vw,22px)}
.vol{display:none;width:92px;flex:none}
.chip{height:36px;min-width:54px;padding:0 12px;border-radius:99px;font:700 12.5px Tajawal;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.speed{position:relative}
.menu{position:absolute;bottom:calc(100% + 12px);left:0;padding:6px;border-radius:20px;display:none;flex-direction:column;min-width:96px;background:rgba(20,22,32,.96);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:9}
.menu.open{display:flex}.menu button{padding:9px 14px;border-radius:14px;font:500 13px Tajawal;text-align:left}.menu button.cur{background:linear-gradient(180deg,rgba(255,159,10,.4),rgba(255,106,0,.2));color:#ffd9a0}
@media (hover:hover){.menu button:hover{background:rgba(255,255,255,.12)}}
@media (min-width:620px){.ctrl-wrap{display:grid;grid-template-columns:1fr auto 1fr}.grp.main{order:0}.grp.left{justify-content:flex-start;gap:8px}.grp.right{justify-content:flex-end;gap:6px}}
@media (min-width:940px){.vol{display:block}}
@media (max-width:380px){.gb{--s:36px}.gb.big{--s:42px}.play{--s:58px}.chip{min-width:46px;padding:0 8px}}
@media (orientation:landscape) and (max-height:520px){.topbar{flex-direction:row;justify-content:center;padding-top:6px}.sw-wrap{max-width:560px}.subrow{width:auto}.dock{padding:6px 12px 8px;border-radius:26px}.bottom{padding-bottom:6px}.play{--s:52px}.seek-container{height:30px}#pvBox{bottom:38px}}
@media (min-width:1400px){.dock{padding:14px 22px 16px}.gb.big{--s:52px}.play{--s:74px}}

input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:none;margin:0;width:100%;outline:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(to right,var(--a) var(--p),rgba(255,255,255,.2) var(--p));box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.pan input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to left,var(--a) var(--p),rgba(255,255,255,.2) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:rgba(255,255,255,.2)}input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--a)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 28%,#fff,#f0f0f6 55%,#c9cad6);box-shadow:0 0 0 1px rgba(255,255,255,.7),0 3px 9px rgba(0,0,0,.5);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:0;background:#f0f0f6}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}

/* ===== floating bits ===== */
#gestures{position:absolute;inset:0;z-index:90;touch-action:none}
.locked-shield{position:absolute;inset:0;z-index:999}
#emptyState{position:absolute;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:min(88vw,360px);padding:30px 24px;border-radius:40px;text-align:center;pointer-events:none;transition:opacity .5s}
.has-video #emptyState{opacity:0;visibility:hidden}
#emptyState .ic{width:56px;height:56px;margin:0 auto 14px;stroke-width:1.4;color:var(--a);filter:drop-shadow(0 0 16px var(--ag))}
#emptyState b{font-size:21px;display:block;margin-bottom:6px}#emptyState span{font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.7}
#spinner{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px;border-radius:50%;z-index:95;pointer-events:none;display:none}
#spinner svg{position:absolute;inset:12px;width:40px;height:40px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#gHint{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:1500;padding:10px 22px;border-radius:99px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;direction:ltr;pointer-events:none;opacity:0;transition:opacity .2s}
#gHint .ic{color:var(--a)}#gHint.noico .ic{display:none}
.notification{position:absolute;top:calc(var(--t) + 124px);left:50%;transform:translateX(-50%);z-index:2000;max-width:90%;padding:11px 20px;border-radius:99px;display:flex;align-items:center;gap:10px;font-size:13.5px;pointer-events:none;opacity:0;transition:opacity .3s}
.notification .ic{width:18px;height:18px;color:var(--a)}
@media (orientation:landscape) and (max-height:520px){.notification{top:calc(var(--t) + 70px)}}
.dirbar{position:absolute;z-index:120;left:50%;bottom:calc(var(--b) + 16px);transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:6px;border-radius:99px;direction:ltr}
.dir .dirbar{display:flex}.dir #ui{display:none}
.abbar{position:absolute;bottom:calc(100% + 8px);left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 24px);display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:6px;border-radius:28px}
.abbar.open{display:flex}.cmsg{min-width:160px;height:42px;padding:0 18px;display:flex;align-items:center;justify-content:center;border-radius:99px;font:700 13px Tajawal;text-align:center;--pg:0%;background:linear-gradient(90deg,rgba(255,159,10,.6) var(--pg),rgba(255,255,255,.1) var(--pg))}.abbar .pb{padding:0 14px;white-space:nowrap;height:42px;gap:10px}.abbar b{font:700 12px monospace;direction:ltr;color:#fff;opacity:.85}
#abSeg{position:absolute;top:-4px;height:14px;border-radius:5px;background:rgba(255,159,10,.3);border-left:3px solid #fff;border-right:3px solid #fff;display:none;pointer-events:none}
.unlock{position:absolute;bottom:calc(var(--b) + 48px);left:50%;transform:translateX(-50%);z-index:1500;display:flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;font-weight:700;font-size:14.5px}
.unlock .ic{color:var(--a)}

/* ===== Filters panel ===== */
.filters-panel{position:absolute;z-index:1002;top:calc(var(--t) + 12px);bottom:calc(var(--b) + 12px);right:calc(var(--r) + 12px);width:min(380px,calc(100% - 24px));border-radius:32px;display:flex;flex-direction:column;overflow:hidden;visibility:hidden;opacity:0;transform:translateX(115%);background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 50%,rgba(255,255,255,.08)),rgba(14,16,26,.72);transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .35s,visibility 0s .55s}
.filters-panel.active{visibility:visible;opacity:1;transform:none;transition-delay:0s}
@media (max-width:639px) and (orientation:portrait){.filters-panel{top:auto;left:calc(var(--l) + 8px);right:calc(var(--r) + 8px);bottom:calc(var(--b) + 8px);width:auto;height:min(78dvh,640px);transform:translateY(115%)}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;font-weight:700;font-size:16px}.ph span{display:flex;align-items:center;gap:10px}.ph .ic{color:var(--a)}
.ps{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 12px}
.pr{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}.pr::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:99px;font:500 12.5px Tajawal;white-space:nowrap;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
.pc:active{transform:scale(.94)}.pc.active{background:linear-gradient(180deg,rgba(255,159,10,.55),rgba(255,106,0,.35));box-shadow:inset 0 1px 0 rgba(255,220,170,.7),0 0 16px var(--ag);font-weight:700}
.pc i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 3px rgba(0,0,0,.4)}
.sl{margin-bottom:10px}.sl div{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.78)}.sl b{color:#ffc46b;font:700 12.5px monospace;direction:ltr}
.at{display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-weight:700;font-size:13.5px;color:#ffc46b}.at .ic{width:18px;height:18px}
.pf{padding:12px 20px calc(16px);display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.12)}
.pb{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:99px;font-weight:700;font-size:13.5px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.45);user-select:none;touch-action:none;transition:transform .15s}
.pb:active{transform:scale(.97)}.pb.o{color:#ffd9a0;background:linear-gradient(180deg,rgba(255,159,10,.38),rgba(255,106,0,.16))}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}*{transition-duration:.01s!important}}
</style>
</head>

<symbol id="i-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
<symbol id="i-fb" viewBox="0 0 24 24"><path d="M5.5 5v14"/><path d="M19 6.4v11.2a.9.9 0 0 1-1.4.75l-8.1-5.6a.9.9 0 0 1 0-1.5l8.1-5.6A.9.9 0 0 1 19 6.4Z" fill="currentColor"/></symbol>

<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const P=o=>({brightness:100,contrast:100,saturate:100,hue:0,blur:0,sepia:0,temp:0,tint:0,gamma:100,shadows:0,highlights:0,sharp:0,vignette:0,...o});
const filterPresets={normal:P(),cinematic:P({brightness:105,contrast:120,saturate:125,sepia:15}),noir:P({contrast:150,saturate:0,sepia:5}),cyberpunk:P({brightness:110,contrast:125,saturate:175,hue:320}),cool:P({brightness:95,contrast:105,saturate:85,hue:190}),vintage:P({brightness:90,contrast:95,saturate:75,hue:15,sepia:45}),
auto:P({contrast:112,saturate:118,gamma:108,shadows:15,highlights:-10,sharp:25}),hdr:P({contrast:125,saturate:130,gamma:112,shadows:35,highlights:-30,sharp:45}),vivid:P({brightness:102,contrast:110,saturate:155,sharp:15,temp:5}),night:P({brightness:110,contrast:110,saturate:110,gamma:145,shadows:45,highlights:-15,sharp:10}),warm:P({brightness:102,contrast:108,saturate:115,shadows:10,highlights:-5,sharp:10,temp:35,tint:5,vignette:25}),anime:P({brightness:102,contrast:115,saturate:150,gamma:105,sharp:60}),fixfade:P({contrast:130,saturate:125,gamma:95,shadows:-20,highlights:-10,sharp:20})};
let manualFilters={...filterPresets.normal};
const PR=[['normal','طبيعي','#eee,#8c8c98'],['cinematic','سينمائي دافئ','#ffd29a,#c8631e'],['noir','سينما نوار (B&W)','#f4f4f4,#1c1c1c'],['cyberpunk','سايبربانك','#ff3df2,#18d8ff'],['cool','بارد','#9fdcff,#2a62d9'],['vintage','فنتج','#e6c48a,#7a5230'],['auto','تحسين تلقائي','#fff3b0,#ffa94d'],['hdr','HDR واقعي','#fff,#3a7bd5'],['vivid','ألوان نابضة','#ff5f6d,#ffc371'],['night','تفتيح المشاهد المظلمة','#6d7bff,#0b1030'],['warm','دافئ ذهبي','#ffe29a,#ff8a3d'],['anime','أنمي / كرتون','#ff9ad5,#7be0ff'],['fixfade','إصلاح الباهت','#d9d9df,#4a6fa5']];
const SL=[['brightness','السطوع (Brightness)',50,200],['contrast','التباين (Contrast)',50,200],['saturate','تشبع الألوان (Saturation)',0,200],['hue','درجة اللون (Hue Rotate)',0,360],['blur','التغبيش وضبابية (Blur)',0,10,.5],['sepia','تأثير عتيق كلاسيكي (Sepia)',0,100],0,['temp','حرارة اللون (بارد ← دافئ)',-100,100],['tint','الصبغة (أخضر ← أرجواني)',-100,100],['gamma','جاما — إضاءة المناطق المتوسطة',50,200],['shadows','رفع/خفض الظلال',-100,100],['highlights','استعادة/تعزيز الإضاءات العالية',-100,100],['sharp','الحدة والتفاصيل (Sharpen)',0,100],['vignette','تظليل الحواف (Vignette)',0,100]];

$('sliders').innerHTML=SL.map(s=>s?`<div class="sl"><div><span>${s[1]}</span><b id="val-${s[0]}">${manualFilters[s[0]]}${sfx(s[0])}</b></div><input type="range" id="adjust-${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]||1}" value="${manualFilters[s[0]]}" oninput="updateManualFilter('${s[0]}',this.value)"></div>`:`<div class="at">${I('spk')}تدرج ألوان متقدم</div>`).join('');

 const datas=trs.map((t,i)=>{let L=0;for(let k=sels[i].s;k<sels[i].e;k++)L+=t.sz[k];const o=new Uint8Array(L);let q=0;for(let k=sels[i].s;k<sels[i].e;k++){o.set(buf.subarray(t.off[k]-lo,t.off[k]-lo+t.sz[k]),q);q+=t.sz[k]}return o});
 const total=datas.reduce((a,x)=>a+x.length,0);
 const mv=raw(moov,mvx),sd=Math.round((B-A2)*mts);if(moov[mvx.b]){put(mv,32,0);put(mv,36,sd)}else put(mv,24,sd);if(ct!=null)tm(mv,moov[mvx.b],ct);
 const mkMoov=offs=>mk('moov',mv,...trs.map((t,i)=>build(moov,t,sels[i],A2,B,mts,offs[i],ct)));
 let m=mkMoov(trs.map(()=>0)),acc=ftyp.length+m.length+8;const offs=datas.map(x=>{const o=acc;acc+=x.length;return o});
 if(acc>4294967295)throw Error('big');m=mkMoov(offs);
 const mh=new Uint8Array(8);put(mh,0,total+8);mh.set([109,100,97,116],4);
 return new Blob([ftyp,m,mh,...datas],{type:'video/mp4'})}
})();
let clipFile=null,clipFiles=[],clipCancel=false;
const cbar=$('clipBar'),cmsg=$('clipMsg'),cSave=$('clipSave');
function clipUI(done,txt,pg){cbar.classList.add('open');$('abBar').classList.remove('open');cmsg.textContent=txt;cmsg.style.setProperty('--pg',pg+'%');cSave.classList.toggle('hidden',!done)}
function clipClose(){cbar.classList.remove('open');if(clipBusy)clipCancel=true;clipBusy=false}
const CLIP_ERR={frag:'هذا الملف مجزّأ (fragmented) وغير مدعوم للقص',nomoov:'تعذّر قراءة الملف — القص يدعم MP4 و MOV فقط',norange:'المصدر لا يدعم التحميل الجزئي أو يمنع الوصول (CORS) — جرّب ملفاً محلياً',big:'المقطع كبير جداً للقص على هذا الجهاز',empty:'المقطع المحدد فارغ'};
async function clipStart(){
 if(clipBusy)return;
 if(abA==null||abB==null){showNotification('حدد البداية والنهاية أولاً');return}
 const src=localFile||(/^https?:/.test(video.currentSrc)?video.currentSrc:null);
 if(!src){showNotification('لا يوجد مصدر قابل للقص');return}
 clipBusy=true;clipCancel=false;clipFile=null;clipUI(false,'جارٍ التحضير…',3);
 try{const blob=await mp4Cut(src,abA,abB,(t,p)=>{if(!clipCancel)clipUI(false,t,p)});
  if(clipCancel)return;
  clipFile=new File([blob],'clip_'+Date.now()+'.mp4',{type:'video/mp4'});clipFiles=[clipFile];
  const can=navigator.canShare&&navigator.canShare({files:[clipFile]});
  $('clipSaveTxt').textContent='إرسال إلى الألبوم';
  clipDownload();
  clipUI(!!can,'تم القص وحُفظ تلقائياً (MP4)',100)}
 catch(e){if(clipCancel)return;cbar.classList.remove('open');showNotification(CLIP_ERR[e.message]||'تعذّر القص — قد يمنع المصدر الوصول (CORS) أو الصيغة غير مدعومة')}
 finally{clipBusy=false}}
async function clipShare(){const fs=clipFiles;if(!fs.length)return;const dl=()=>fs.forEach((f,i)=>setTimeout(()=>clipDownload(f,true),i*900));
 try{if(navigator.canShare&&navigator.canShare({files:fs}))await navigator.share({files:fs,title:'مقاطع'});else dl()}
 catch(e){if(e.name!=='AbortError')dl()}}
function clipDownload(f=clipFile,q){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);if(!q)showNotification('تم حفظ المقطع تلقائياً في التنزيلات')}
async function randomClips(){
 if(clipBusy)return;
 const d=video.duration,src=localFile||(/^https?:/.test(video.currentSrc)?video.currentSrc:null);
 if(!src||!isFinite(d)){showNotification('شغّل فيديو أولاً');return}
 if(d<65){showNotification('الفيديو أقصر من 65 ثانية');return}
 const R=[[0,.2],[.3,.45],[.45,.6],[.6,.8],[.8,.95]],ms=Math.round(d-60),ct=Math.floor(Date.UTC(2026,4,28,7,22,0)/1000)+2082844800;
 clipBusy=true;clipCancel=false;clipFiles=[];clipUI(false,'جارٍ التحضير…',2);
 try{for(let i=0;i<5;i++){let mn=Math.round(d*R[i][0]),mx=Math.min(Math.round(d*R[i][1]),ms);if(mn>mx)mn=mx;
   const st=mn+Math.floor(Math.random()*(mx-mn+1)),n=i+1;
   const blob=await mp4Cut(src,st,st+60,(t,p)=>{if(!clipCancel)clipUI(false,'لقطة '+n+'/5 — '+t,Math.round((i+p/100)/5*100))},ct,60);
   if(clipCancel)return;
   const f=new File([blob],'Clip_'+n+'_60s.mp4',{type:'video/mp4'});clipFiles.push(f);clipDownload(f,true);await new Promise(r=>setTimeout(r,900))}
  const can=navigator.canShare&&navigator.canShare({files:clipFiles});
  $('clipSaveTxt').textContent='إرسال الكل إلى الألبوم';clipUI(!!can,'تم حفظ 5 لقطات (5 دقائق) تلقائياً',100);showNotification('تم حفظ 5 لقطات في التنزيلات')}
 catch(e){if(clipCancel)return;cbar.classList.remove('open');showNotification(CLIP_ERR[e.message]||'تعذّر القص — قد يمنع المصدر الوصول (CORS) أو الصيغة غير مدعومة')}
 finally{clipBusy=false}}

/* ---------- القفل ---------- */
let unlockTimer;
function flashLockHint(){unlockBtn.classList.remove('hidden');clearTimeout(unlockTimer);unlockTimer=setTimeout(()=>unlockBtn.classList.add('hidden'),2500)}
function toggleLock(){isLocked=!isLocked;ico($('lockIcon'),isLocked?'lock':'unlock');$('lockIcon').style.color=isLocked?'var(--a)':'';unlockBtn.classList.add('hidden');
 if(isLocked){ui.classList.add('ui-hidden');lockShield.classList.remove('hidden');filtersPanel.classList.remove('active');showNotification('الشاشة مقفلة — المس الشاشة لإظهار زر فك القفل')}else{lockShield.classList.add('hidden');showUI()}}

/* ---------- مراقب التجمّد ---------- */
let lastT=-1,stuck=0,stage=0;
setInterval(()=>{if(video.paused||video.ended||dragging||video.seeking||!video.currentSrc){stuck=0;stage=0;return}
 if(Math.abs(video.currentTime-lastT)<.01){if(++stuck>=5){stuck=0;const t=video.currentTime;
  if(stage===0){stage=1;video.currentTime=Math.min(video.duration,t+.2);video.play().catch(()=>{})}
  else{stage=0;const s=video.currentSrc;video.src=s;video.load();video.addEventListener('loadedmetadata',()=>{video.currentTime=t;video.play().catch(()=>{})},{once:true});showNotification('تمت إعادة الاتصال بالفيديو تلقائياً')}}}
 else{stuck=0;stage=0}lastT=video.currentTime},1000);

/* ---------- الاستئناف + FPS ---------- */
let lastSave=0;const posKey=()=>'vlcpos:'+urlInput.value;
function savePos(){if(Math.abs(video.currentTime-lastSave)<5)return;lastSave=video.currentTime;try{localStorage.setItem(posKey(),String(Math.floor(video.currentTime)))}catch(e){}}
video.addEventListener('loadedmetadata',()=>{pvBox.classList.remove('show');bufFill.style.width='0';window.detectedFps=null;fpsS.length=0;try{const p=parseFloat(localStorage.getItem(posKey()));if(p>5&&p<video.duration-10){video.currentTime=p;showNotification('تم الاستئناف من '+formatTime(p))}}catch(e){}});
video.addEventListener('ended',()=>{try{localStorage.removeItem(posKey())}catch(e){}});
const fpsS=[];let lastMT=null;
if('requestVideoFrameCallback'in video){const cb=(n,m)=>{if(lastMT!==null&&!video.paused&&video.playbackRate===1){const dt=m.mediaTime-lastMT;if(dt>0&&dt<.2){fpsS.push(dt);if(fpsS.length>40)fpsS.shift();if(fpsS.length>=20)window.detectedFps=Math.round(1/[...fpsS].sort((a,b)=>a-b)[fpsS.length>>1])}}lastMT=m.mediaTime;video.requestVideoFrameCallback(cb)};video.requestVideoFrameCallback(cb)}

/* ---------- الصوت / التكرار / السرعة ---------- */
function toggleMute(){video.muted=!video.muted}
function toggleLoop(){video.loop=!video.loop;$('loopBtn').classList.toggle('on',video.loop);hint(video.loop?'التكرار: مفعّل':'التكرار: متوقف',false,'rep')}
$('muteBtn').onclick=toggleMute;$('loopBtn').onclick=toggleLoop;
$('volRange').oninput=e=>{video.volume=+e.target.value;video.muted=false};
video.addEventListener('volumechange',()=>{ico($('muteBtn'),video.muted||!video.volume?'vm':'vh');$('volRange').value=video.muted?0:video.volume;fillPct($('volRange'))});
const sm=$('speedMenu');
sm.innerHTML=[.25,.5,1,1.25,1.5,2].map(r=>`<button data-r="${r}">${r.toFixed(r%1?2:1).replace(/0$/,'')}×</button>`).join('');
$('speedBtn').onclick=e=>{e.stopPropagation();sm.classList.toggle('open')};
sm.onclick=e=>{const r=e.target.dataset.r;if(r){video.playbackRate=+r;sm.classList.remove('open')}};
document.addEventListener('click',()=>sm.classList.remove('open'));
video.addEventListener('ratechange',()=>{$('speedBtn').textContent=video.playbackRate.toFixed(2).replace(/0$/,'')+'×';sm.querySelectorAll('button').forEach(b=>b.classList.toggle('cur',+b.dataset.r===video.playbackRate))});
video.dispatchEvent(new Event('ratechange'));

/* ---------- شاشة مستيقظة + مفاتيح الوسائط ---------- */
let wake=null;
async function wakeSet(on){try{if(on&&'wakeLock'in navigator)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null}}catch(e){}}
video.addEventListener('play',()=>wakeSet(true));video.addEventListener('pause',()=>wakeSet(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!video.paused)wakeSet(true)});
if('mediaSession'in navigator){const ms=navigator.mediaSession;ms.setActionHandler('play',()=>video.play());ms.setActionHandler('pause',()=>video.pause());ms.setActionHandler('seekbackward',()=>skip(-10));ms.setActionHandler('seekforward',()=>skip(10));video.addEventListener('loadedmetadata',()=>{ms.metadata=new MediaMetadata({title:decodeURIComponent(urlInput.value.split('/').pop()||'VLC Ultimate Pro')})})}

/* ---------- لوحة المفاتيح ---------- */
window.onkeydown=e=>{if(document.activeElement===urlInput)return;const k=e.code;
 if(k==='Space'||k==='KeyK'){e.preventDefault();togglePlay()}else if(k==='KeyF')requestFullScreen();else if(k==='KeyP')togglePIP();
 else if(k==='ArrowRight'){const n=e.shiftKey?30:10;skip(n);hint('+'+n+'s',false,'fwd')}else if(k==='ArrowLeft'){const n=e.shiftKey?30:10;skip(-n);hint('−'+n+'s',false,'rew')}
 else if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();video.volume=clamp(video.volume+(k==='ArrowUp'?.05:-.05),0,1);hint(Math.round(video.volume*100)+'%',false,'vh')}
 else if(k==='KeyM')toggleMute();else if(k==='KeyL')toggleLoop();else if(k==='Comma'||k==='BracketLeft')stepFrame(-1);else if(k==='Period'||k==='BracketRight')stepFrame(1);
 else if(k==='KeyS')captureCurrentFrame();else if(k==='KeyG')toggleFiltersPanel();else if(k==='KeyD')toggleDirector();else if(k==='KeyA')abSet('a');else if(k==='KeyB')abSet('b');else if(k==='Escape'){filtersPanel.classList.remove('active');box.classList.remove('dir')}
 else if(/^Digit[0-9]$/.test(k)&&video.duration)video.currentTime=video.duration*(+k[5]/10)};

</script>
