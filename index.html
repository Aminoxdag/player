<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VLC Ultimate Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --vlc-orange: #ff9500; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; color: white; font-family: system-ui, -apple-system, sans-serif; }
        
        #playerContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        #mainVideo {
            width: 100% !important;
            height: 100% !important;
            transition: object-fit 0.2s ease;
            display: block;
            filter: none;
        }

        .fit-contain { object-fit: contain !important; } 
        .fit-fill { object-fit: fill !important; }        
        .fit-cover { object-fit: cover !important; }     

        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(rgba(0,0,0,0.85) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.92) 100%);
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .ui-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px;
            z-index: 1001;
        }

        .url-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            width: 100%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .library-btn, .upload-btn, .filter-toggle-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 149, 0, 0.2);
            color: var(--vlc-orange);
            border-radius: 50%;
            border: 1px solid rgba(255, 149, 0, 0.3);
            margin-left: 8px;
            flex-shrink: 0;
            transition: 0.2s;
            cursor: pointer;
        }
        .library-btn:active, .upload-btn:active, .filter-toggle-btn:active { transform: scale(0.9); background: var(--vlc-orange); color: black; }

        .url-input {
            background: transparent;
            flex: 1;
            font-size: 13px;
            outline: none;
            border: none;
            text-align: right;
            color: white;
            padding: 0 10px;
        }

        .play-action-btn {
            background: var(--vlc-orange);
            color: black;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .play-action-btn:active { transform: scale(0.95); opacity: 0.9; }

        .search-results {
            position: absolute;
            top: 115%;
            left: 10px;
            right: 10px;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .search-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            text-align: right;
            color: #ddd;
        }
        .search-item:hover { background: var(--vlc-orange); color: black; font-weight: 600; }

        .seek-container {
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            direction: ltr !important; 
        }

        .seek-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            position: relative;
        }

        #progFill {
            height: 100%;
            background: var(--vlc-orange);
            width: 0%;
            border-radius: 10px;
            position: absolute;
            left: 0;
            top: 0;
        }

        #progFill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
        }

        .badge-aspect {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-skip, .btn-frame, .btn-capture {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .btn-skip i, .btn-frame i, .btn-capture i { font-size: 22px; margin-bottom: 4px; }
        .btn-skip:active, .btn-frame:active, .btn-capture:active { transform: scale(0.9); color: var(--vlc-orange); }
        
        .notification {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--vlc-orange);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* NEW DESIGN: Responsive Sliding Side Drawer for Filters
          Slides in smoothly from the right, preventing any control overlap.
        */
        .filters-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            z-index: 1002; /* Sits over the UI overlays for absolute control */
            box-shadow: -10px 0 40px rgba(0,0,0,0.85);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            transform: translateX(100%);
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .filters-panel.active {
            transform: translateX(0);
            opacity: 1;
        }

        .filter-slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        
        .filter-slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        /* Highly Touch-friendly custom slider handle */
        .filter-input-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.15);
            outline: none;
            margin: 6px 0;
        }
        
        .filter-input-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--vlc-orange);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            border: 2px solid white;
            transition: transform 0.1s;
        }
        
        .filter-input-range::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }

        .preset-chip {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        
        .preset-chip.active {
            background: var(--vlc-orange);
            color: black;
            font-weight: 600;
            border-color: var(--vlc-orange);
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.3);
        }

        /* UI Lock state overlay click bypass */
        .locked-shield {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: transparent;
        }

        body, button, input, select { font-family: 'Tajawal', system-ui, sans-serif; }
        /* طبقة الإيماءات تحت الواجهة؛ الواجهة لا تحجب اللمس إلا على عناصرها */
        #gestures { position:absolute; inset:0; z-index:90; touch-action:none; -webkit-tap-highlight-color:transparent; }
        .ui-overlay { pointer-events:none; }
        #ui button, #ui input, #ui label, #ui select, #ui .badge-aspect, #ui .seek-container, #ui .search-results { pointer-events:auto; }
        #gHint { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); z-index:1500; background:rgba(0,0,0,.7); backdrop-filter:blur(10px); padding:10px 22px; border-radius:30px; font-size:16px; font-weight:700; pointer-events:none; opacity:0; transition:opacity .2s; direction:ltr; }
        #spinner { position:absolute; top:50%; left:50%; width:46px; height:46px; margin:-23px; border:4px solid rgba(255,255,255,.2); border-top-color:var(--vlc-orange); border-radius:50%; z-index:95; pointer-events:none; display:none; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .seek-container { height:44px; touch-action:none; }
        .seek-bar { height:5px; transition:height .15s; }
        .seek-container.drag .seek-bar { height:9px; }
        .seek-container.drag #progFill::after { transform:translateY(-50%) scale(1.45); }
        #bufFill { position:absolute; left:0; top:0; height:100%; width:0; background:rgba(255,255,255,.3); border-radius:10px; }
        #pvBox { position:absolute; bottom:38px; left:0; width:176px; transform:translateX(-50%); opacity:0; pointer-events:none; transition:opacity .15s; text-align:center; z-index:5; }
        #pvBox.show { opacity:1; }
        #pvCanvas { width:176px; background:#111; border:2px solid var(--vlc-orange); border-radius:10px; display:block; box-shadow:0 8px 30px rgba(0,0,0,.7); }
        #pvTime { display:inline-block; margin-top:4px; font:700 12px monospace; background:rgba(0,0,0,.75); padding:2px 8px; border-radius:8px; }
        .unlock-btn { position:absolute; bottom:48px; left:50%; transform:translateX(-50%); z-index:1500; background:var(--vlc-orange); color:#000; font-weight:700; padding:12px 26px; border-radius:40px; box-shadow:0 8px 30px rgba(0,0,0,.6); }
        .ctl-on { color:var(--vlc-orange) !important; }

        /* ===== إعادة تصميم الواجهة (جوال أولاً + شاشات كبيرة) ===== */
        html, body { height:100%; height:100dvh; }
        #playerContainer { height:100vh; height:100dvh; }
        .ui-overlay { box-sizing:border-box; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background:linear-gradient(rgba(0,0,0,.8), transparent 22%, transparent 60%, rgba(0,0,0,.92)); }
        .topbar { padding:10px 12px 0; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .search-wrapper { width:100%; max-width:680px; min-width:0; }
        .url-box { gap:6px; padding:5px; min-width:0; }
        .ibtn { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%;
            background:rgba(255,149,0,.18); color:var(--vlc-orange); border:1px solid rgba(255,149,0,.3); font-size:15px; cursor:pointer; margin:0; transition:.15s; }
        .ibtn:active { transform:scale(.9); background:var(--vlc-orange); color:#000; }
        .ibtn.glass { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.15); color:#fff; }
        .url-input { min-width:0; flex:1; font-size:14px; padding:0 8px; text-overflow:ellipsis; }
        .go-btn { width:40px; height:40px; flex:none; border-radius:50%; background:var(--vlc-orange); color:#000; font-size:14px; display:flex; align-items:center; justify-content:center; border:0; }
        .go-btn:active { transform:scale(.9); }
        .subrow { width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; padding:0 2px; }
        .badge-aspect { height:36px; display:flex; align-items:center; background:rgba(255,255,255,.1); backdrop-filter:blur(12px); }
        .bottom { width:100%; max-width:980px; margin:0 auto; box-sizing:border-box; padding:0 16px 10px; display:flex; flex-direction:column; gap:0; }
        .times { display:flex; justify-content:space-between; font-size:13px; font-weight:500; opacity:.85; font-variant-numeric:tabular-nums; padding:0 8px; }
        .seek-bar { width:calc(100% - 16px); margin:0 8px; }
        .ctrl-wrap { display:flex; flex-direction:column; gap:6px; }
        .row { display:flex; align-items:center; justify-content:space-between; gap:4px; }
        .row.main { justify-content:center; gap:clamp(12px,5vw,34px); }
        .cbtn { position:relative; flex:none; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; background:transparent; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:.12s; }
        .cbtn:active { background:rgba(255,255,255,.16); transform:scale(.9); }
        .cbtn.sk { font-size:30px; }
        .cbtn small { position:absolute; top:50%; left:50%; transform:translate(-50%,-44%); font:700 9px/1 'Tajawal',sans-serif; }
        .cbtn.s { width:42px; height:42px; font-size:18px; color:rgba(255,255,255,.82); }
        .cbtn.accent { color:var(--vlc-orange); background:rgba(255,149,0,.14); border:1px solid rgba(255,149,0,.35); }
        .play-main { flex:none; width:68px; height:68px; border-radius:50%; background:var(--vlc-orange); color:#000; font-size:26px; border:0; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(255,149,0,.35); cursor:pointer; transition:.12s; }
        .play-main:active { transform:scale(.92); }
        .chip { height:36px; padding:0 10px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:20px; font-size:12px; outline:none; flex:none; }
        .chip option { background:#111; color:#fff; }
        .vol { display:none; width:90px; flex:none; }
        @media (min-width:768px) { .vol { display:block; } .row.sec { justify-content:center; gap:14px; } }
        @media (orientation:landscape) and (max-height:520px) {
            .topbar { flex-direction:row; align-items:center; padding-top:6px; }
            .subrow { width:auto; gap:8px; }
            .bottom { padding-bottom:4px; }
            .ctrl-wrap { flex-direction:row; align-items:center; justify-content:space-between; }
            .row.main { gap:10px; } .play-main { width:52px; height:52px; font-size:21px; }
            .cbtn { width:40px; height:40px; } .cbtn.sk { font-size:26px; }
            .row.sec { gap:2px; }
        }
        .notification { top:calc(env(safe-area-inset-top) + 120px); max-width:90%; text-align:center; }
        #filtersPanel { width:min(100%,380px); box-sizing:border-box; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
        #filtersPanel > div:first-child { flex:1; min-height:0; overflow-y:auto; }
        #filtersPanel .overflow-y-auto { max-height:none !important; }
    </style>
</head>
<body>

<div id="playerContainer">
    <!-- Main Video Player Element -->
    <video id="mainVideo" class="fit-contain" playsinline webkit-playsinline preload="auto">
    </video>

    <!-- Invisible protection shield when UI is locked -->
    <div id="lockShield" class="locked-shield hidden" onclick="flashLockHint()"></div>

    <div id="gestures"></div>
    <div id="spinner"></div>
    <div id="gHint"></div>
    <!-- UI Overlay Layer -->
    <div id="ui" class="ui-overlay">
        <div class="topbar">
            <div class="search-wrapper">
                <div class="url-box">
                    <button class="ibtn" onclick="window.open('https://aminoxdag.github.io/BLACKED-POMF/', '_blank')" title="المكتبة"><i class="fas fa-th-large"></i></button>
                    <label class="ibtn" title="رفع فيديو من جهازك">
                        <input type="file" id="localVideoFile" accept="video/*" style="display:none" onchange="loadLocalVideo(this)">
                        <i class="fas fa-file-import"></i>
                    </label>
                    <button class="ibtn" onclick="toggleFiltersPanel()" title="الفلاتر والألوان"><i class="fas fa-sliders-h"></i></button>
                    <input type="text" id="videoUrl" class="url-input" placeholder="ابحث أو الصق رابط الفيديو..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
                    <button id="mainActionBtn" class="go-btn" onclick="updateSource()" title="تشغيل"><i class="fas fa-play"></i></button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
            <div class="subrow">
                <div onclick="cycleAspect()" class="badge-aspect" id="aspectLabel">وضع العرض: FIT</div>
                <button onclick="toggleLock()" class="ibtn glass" title="قفل الشاشة"><i id="lockIcon" class="fas fa-unlock"></i></button>
            </div>
        </div>

        <div class="bottom">
            <div class="times" dir="ltr"><span id="currentTime">00:00</span><span id="durationTime">00:00</span></div>
            <div class="seek-container" id="seekWrapper"><div class="seek-bar"><div id="progFill"></div></div></div>
            <div class="ctrl-wrap" dir="ltr">
                <div class="row main">
                    <button class="cbtn sk" onclick="skip(-10)" title="رجوع 10 ثوانٍ"><i class="fas fa-rotate-left"></i><small>10</small></button>
                    <button class="cbtn" onclick="stepFrame(-1)" title="الإطار السابق"><i class="fas fa-backward-step"></i></button>
                    <button id="playBtnSmall" class="play-main" onclick="togglePlay()" title="تشغيل / إيقاف"><i class="fas fa-play"></i></button>
                    <button class="cbtn" onclick="stepFrame(1)" title="الإطار التالي"><i class="fas fa-forward-step"></i></button>
                    <button class="cbtn sk" onclick="skip(10)" title="تقديم 10 ثوانٍ"><i class="fas fa-rotate-right"></i><small>10</small></button>
                </div>
                <div class="row sec">
                    <select class="chip" title="السرعة" onchange="video.playbackRate = parseFloat(this.value)">
                        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
                        <option value="1" selected>1.0x</option><option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option><option value="2">2.0x</option>
                    </select>
                    <button id="muteBtn" class="cbtn s" title="كتم (M)"><i class="fas fa-volume-high"></i></button>
                    <input type="range" id="volRange" class="filter-input-range vol" min="0" max="1" step="0.05" value="1">
                    <button id="loopBtn" class="cbtn s" title="تكرار (L)"><i class="fas fa-repeat"></i></button>
                    <button class="cbtn s accent" onclick="captureCurrentFrame()" title="حفظ لقطة بالفلاتر"><i class="fas fa-camera"></i></button>
                    <button id="pipBtn" class="cbtn s" onclick="togglePIP()" title="صورة داخل صورة"><i class="fas fa-window-restore"></i></button>
                    <button class="cbtn s" onclick="requestFullScreen()" title="ملء الشاشة (F)"><i class="fas fa-expand"></i></button>
                </div>
            </div>
        </div>
    </div>
    <div id="toastNotification" class="notification"></div>

    <!-- 
      NEW GLASSMORPHIC SIDE DRAWER 
      Positioned absolutely on the right to guarantee comfortable access 
      without overlapping video or top bars.
    -->
    <div id="filtersPanel" class="filters-panel">
        <div>
            <!-- Header and close control -->
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-white/10">
                <span class="text-base font-bold text-orange-400 flex items-center gap-2">
                    <i class="fas fa-sliders-h"></i>
                    تعديل الألوان والفلاتر
                </span>
                <button onclick="toggleFiltersPanel()" class="text-white/50 hover:text-white transition text-lg px-2">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Preset Quick Selections (Horizontal Scrollable) -->
            <div class="mb-6">
                <span class="text-xs text-white/50 block mb-3">فلاتر جاهزة سريعة:</span>
                <div class="flex gap-2 overflow-x-auto pb-3" style="-webkit-overflow-scrolling: touch;">
                    <div id="preset-normal" class="preset-chip active" onclick="applyPreset('normal')">طبيعي</div>
                    <div id="preset-cinematic" class="preset-chip" onclick="applyPreset('cinematic')">سينمائي دافئ</div>
                    <div id="preset-noir" class="preset-chip" onclick="applyPreset('noir')">سينما نوار (B&W)</div>
                    <div id="preset-cyberpunk" class="preset-chip" onclick="applyPreset('cyberpunk')">سايبربانك</div>
                    <div id="preset-cool" class="preset-chip" onclick="applyPreset('cool')">بارد</div>
                    <div id="preset-vintage" class="preset-chip" onclick="applyPreset('vintage')">فنتج</div>
                </div>
            </div>

            <!-- Touch Friendly Precision Manual Controllers -->
            <div class="flex flex-col gap-1 overflow-y-auto pr-1" style="max-height: calc(100vh - 280px);">
                <!-- Brightness -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>السطوع (Brightness)</span>
                        <span id="val-brightness" class="font-mono text-orange-400 font-bold">100%</span>
                    </div>
                    <input type="range" id="adjust-brightness" class="filter-input-range" min="50" max="200" value="100" oninput="updateManualFilter('brightness', this.value)">
                </div>
                <!-- Contrast -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>التباين (Contrast)</span>
                        <span id="val-contrast" class="font-mono text-orange-400 font-bold">100%</span>
                    </div>
                    <input type="range" id="adjust-contrast" class="filter-input-range" min="50" max="200" value="100" oninput="updateManualFilter('contrast', this.value)">
                </div>
                <!-- Saturation -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>تشبع الألوان (Saturation)</span>
                        <span id="val-saturate" class="font-mono text-orange-400 font-bold">100%</span>
                    </div>
                    <input type="range" id="adjust-saturate" class="filter-input-range" min="0" max="200" value="100" oninput="updateManualFilter('saturate', this.value)">
                </div>
                <!-- Hue-rotate -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>درجة اللون (Hue Rotate)</span>
                        <span id="val-hue" class="font-mono text-orange-400 font-bold">0°</span>
                    </div>
                    <input type="range" id="adjust-hue" class="filter-input-range" min="0" max="360" value="0" oninput="updateManualFilter('hue', this.value)">
                </div>
                <!-- Blur -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>التغبيش وضبابية (Blur)</span>
                        <span id="val-blur" class="font-mono text-orange-400 font-bold">0px</span>
                    </div>
                    <input type="range" id="adjust-blur" class="filter-input-range" min="0" max="10" value="0" step="0.5" oninput="updateManualFilter('blur', this.value)">
                </div>
                <!-- Sepia -->
                <div class="filter-slider-container">
                    <div class="filter-slider-label">
                        <span>تأثير عتيق كلاسيكي (Sepia)</span>
                        <span id="val-sepia" class="font-mono text-orange-400 font-bold">0%</span>
                    </div>
                    <input type="range" id="adjust-sepia" class="filter-input-range" min="0" max="100" value="0" oninput="updateManualFilter('sepia', this.value)">
                </div>
            </div>
        </div>

        <!-- Reset Button inside drawer footer -->
        <div class="pt-4 border-t border-white/10 mt-4">
            <button onclick="resetFilters()" class="w-full py-3 bg-white/5 hover:bg-white/10 active:scale-95 text-white text-sm font-semibold rounded-xl transition duration-200">
                إعادة ضبط كافة الفلاتر والألوان
            </button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const ui = document.getElementById('ui');
    const progFill = document.getElementById('progFill');
    const seekWrapper = document.getElementById('seekWrapper');
    const aspectLabel = document.getElementById('aspectLabel');
    const urlInput = document.getElementById('videoUrl');
    const searchResults = document.getElementById('searchResults');
    const pipBtn = document.getElementById('pipBtn');
    const toastNotification = document.getElementById('toastNotification');
    const filtersPanel = document.getElementById('filtersPanel');
    const lockShield = document.getElementById('lockShield');
    
    let hideTimer;
    let aspectIndex = 0; 
    let isLocked = false;
    let videoLinks = [];
    let isTyping = false; 
    let currentObjectURL = null;

    const DEFAULT_FPS = 25;

    // Filter properties state
    let manualFilters = {
        brightness: 100,
        contrast: 100,
        saturate: 100,
        hue: 0,
        blur: 0,
        sepia: 0
    };

    const filterPresets = {
        normal: { brightness: 100, contrast: 100, saturate: 100, hue: 0, blur: 0, sepia: 0 },
        cinematic: { brightness: 105, contrast: 120, saturate: 125, hue: 0, blur: 0, sepia: 15 },
        noir: { brightness: 100, contrast: 150, saturate: 0, hue: 0, blur: 0, sepia: 5 },
        cyberpunk: { brightness: 110, contrast: 125, saturate: 175, hue: 320, blur: 0, sepia: 0 },
        cool: { brightness: 95, contrast: 105, saturate: 85, hue: 190, blur: 0, sepia: 0 },
        vintage: { brightness: 90, contrast: 95, saturate: 75, hue: 15, blur: 0, sepia: 45 }
    };

    // Fetch live video list
    async function fetchLinks() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/Aminoxdag/My-links/refs/heads/main/cytube_links.txt');
            const text = await response.text();
            videoLinks = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        } catch (e) { console.error("Data fetch error"); }
    }
    fetchLinks();

    window.onload = function() {
        const videoUrlFromHash = decodeURIComponent(window.location.hash.substring(1));
        if (videoUrlFromHash && videoUrlFromHash.startsWith('http')) {
            urlInput.value = videoUrlFromHash;
            updateSource();
        }
    }

    urlInput.onfocus = () => { 
        isTyping = true; 
        clearTimeout(hideTimer); 
        ui.classList.remove('ui-hidden'); 
    };
    urlInput.onblur = () => { 
        isTyping = false; 
        setTimeout(() => { searchResults.style.display = 'none'; }, 200);
        showUI(); 
    };

    urlInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (query.length === 0) { searchResults.style.display = 'none'; return; }

        if (query.startsWith('http')) {
            searchResults.style.display = 'none';
            return;
        }

        const matches = videoLinks.filter(l => l.toLowerCase().includes(query)).slice(0, 15);
        if (matches.length > 0) {
            searchResults.innerHTML = matches.map(fullLink => {
                let displayName = fullLink.replace(/https?:\/\/cdn\.cinema-blue\.icu\/blk\//gi, '').replace(/%20/g, ' ');
                return `<div class="search-item" data-u="${fullLink.replace(/"/g,'&quot;')}" onclick="selectResult(this.dataset.u)">${displayName}</div>`;
            }).join('');
            searchResults.style.display = 'block';
        } else { searchResults.style.display = 'none'; }
    });

    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            updateSource();
            urlInput.blur();
        }
    });

    function selectResult(fullLink) {
        urlInput.value = fullLink;
        searchResults.style.display = 'none';
        updateSource();
    }

    // High performance video loader utilizing dynamic resource recycling to fix freezes after 1 min
    function loadLocalVideo(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            
            // Critical fix for 1 minute local video freeze:
            // Release/revoke memory of previous object URL to avoid browser buffer overflow
            if (currentObjectURL) {
                URL.revokeObjectURL(currentObjectURL);
            }
            
            currentObjectURL = URL.createObjectURL(file);
            
            // Clean state load
            video.src = currentObjectURL;
            video.preload = "auto";
            video.load();
            
            urlInput.value = `ملف محلي: ${file.name}`;
            
            video.play().then(() => {
                document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>';
                showNotification("تم تحميل ملف الألبوم وتشغيله بنجاح");
            }).catch(e => {
                console.log("Auto-play was paused by browser sandbox");
            });
            showUI();
        }
    }


    // Precise Frame Nav
    function stepFrame(framesCount) {
        if (!video.duration) return;
        
        if (!video.paused) {
            video.pause();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-play"></i>';
        }

        const frameTime = 1 / (window.detectedFps || DEFAULT_FPS);
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (framesCount * frameTime)));
        showUI();
    }

    // Drawer Open/Close Handler
    function toggleFiltersPanel() {
        filtersPanel.classList.toggle('active');
        showUI();
    }

    // Manual slider updater
    function updateManualFilter(property, value) {
        manualFilters[property] = parseFloat(value);
        
        const suffix = (property === 'hue') ? '°' : (property === 'blur') ? 'px' : '%';
        document.getElementById(`val-${property}`).innerText = value + suffix;

        // Reset highlight active classes for presets
        document.querySelectorAll('.preset-chip').forEach(chip => chip.classList.remove('active'));

        applyRenderedFilters();
    }

    // Preset Selection Applier
    function applyPreset(presetKey) {
        const preset = filterPresets[presetKey];
        if (!preset) return;

        manualFilters = { ...preset };

        // Synchronize manual sliders positions on UI
        for (const [prop, val] of Object.entries(preset)) {
            const slider = document.getElementById(`adjust-${prop}`);
            if (slider) {
                slider.value = val;
                const suffix = (prop === 'hue') ? '°' : (prop === 'blur') ? 'px' : '%';
                document.getElementById(`val-${prop}`).innerText = val + suffix;
            }
        }

        document.querySelectorAll('.preset-chip').forEach(chip => chip.classList.remove('active'));
        document.getElementById(`preset-${presetKey}`).classList.add('active');

        applyRenderedFilters();
    }

    function applyRenderedFilters() {
        video.style.filter = getFilterCSSString();
    }

    function getFilterCSSString() {
        return `brightness(${manualFilters.brightness}%) ` +
               `contrast(${manualFilters.contrast}%) ` +
               `saturate(${manualFilters.saturate}%) ` +
               `hue-rotate(${manualFilters.hue}deg) ` +
               `blur(${manualFilters.blur}px) ` +
               `sepia(${manualFilters.sepia}%)`;
    }

    function resetFilters() {
        applyPreset('normal');
        showNotification("تمت إعادة ضبط فلاتر الألوان كلياً");
    }

    // Captures currently playing canvas with all visual properties preserved
    function captureCurrentFrame() {
        if (!video.duration || video.readyState < 2) {
            showNotification("يرجى تشغيل الفيديو لالتقاط صورة!");
            return;
        }

        try {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            
            // Apply live customized filters to the exported canvas rendering context
            ctx.filter = getFilterCSSString();
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/png');
            
            const downloadLink = document.createElement('a');
            const videoName = urlInput.value.split('/').pop().replace(/[^a-zA-Z0-9]/g, '_') || "vlc_capture";
            const timestamp = Math.floor(video.currentTime * 100) / 100;
            
            downloadLink.download = `VLC_Filters_${videoName}_${timestamp}s.png`;
            downloadLink.href = dataUrl;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            showNotification("تم التقاط الإطار بالفلاتر وحفظه بنجاح!");
        } catch (error) {
            console.error(error);
            showNotification("تنبيه: لا يمكن حفظ الصور من روابط خارجية تمنع مشاركة الموارد (CORS). يرجى تجربة ملف محلي!");
        }
    }

    function showNotification(msg) {
        toastNotification.innerText = msg;
        toastNotification.style.opacity = '1';
        setTimeout(() => {
            toastNotification.style.opacity = '0';
        }, 3500);
    }


    
    function togglePlay() {
        if (video.paused) {
            video.play();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            video.pause();
            document.getElementById('playBtnSmall').innerHTML = '<i class="fas fa-play"></i>';
        }
        showUI();
    }

    video.addEventListener('click', () => {
        // Only click to toggle play if the filters side-panel drawer is closed
        if (filtersPanel.classList.contains('active')) {
            filtersPanel.classList.remove('active');
        } else {
            togglePlay();
        }
    });


    function formatTime(s) {
        let m = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return (m < 10 ? '0'+m : m) + ":" + (sec < 10 ? '0'+sec : sec);
    }


    function cycleAspect() {
        aspectIndex = (aspectIndex + 1) % 3;
        video.className = '';
        if (aspectIndex === 0) { video.classList.add('fit-contain'); aspectLabel.innerText = "وضع العرض: FIT"; }
        else if (aspectIndex === 1) { video.classList.add('fit-fill'); aspectLabel.innerText = "وضع العرض: STRETCH"; }
        else if (aspectIndex === 2) { video.classList.add('fit-cover'); aspectLabel.innerText = "وضع العرض: ZOOM"; }
        showUI();
    }


    async function togglePIP() {
        try {
            if (video !== document.pictureInPictureElement) await video.requestPictureInPicture();
            else await document.exitPictureInPicture();
        } catch (e) { console.error("PIP Error"); }
    }

    function requestFullScreen() {
        const container = document.getElementById('playerContainer');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                });
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        } else {
            document.exitFullscreen();
        }
    }

    function skip(val) {
        video.currentTime += val;
        showUI();
    }


    video.onloadedmetadata = () => {
        document.getElementById('durationTime').innerText = formatTime(video.duration);
    };

    window.onkeydown = (e) => {
        if (document.activeElement === urlInput) return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'KeyF') requestFullScreen();
        if (e.code === 'KeyP') togglePIP();
        if (e.code === 'ArrowRight') skip(10);
        if (e.code === 'ArrowLeft') skip(-10);
        if (e.code === 'BracketLeft') stepFrame(-1); 
        if (e.code === 'BracketRight') stepFrame(1); 
        if (e.code === 'KeyS') captureCurrentFrame();
        if (e.code === 'KeyG') toggleFiltersPanel();
    };

    /* ================= ترقية المشغل ================= */
    const $ = id => document.getElementById(id);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const playerBox = $('playerContainer');
    const gHint = $('gHint'), spinner = $('spinner'), gestures = $('gestures');
    playerBox.appendChild(toastNotification); // كان الإشعار داخل الواجهة المخفية فلا يظهر
    let dragging = false, dragPos = 0, hintTimer, triedNoCors = false;

    function hint(t, keep) {
        gHint.textContent = t; gHint.style.opacity = 1;
        clearTimeout(hintTimer);
        if (!keep) hintTimer = setTimeout(() => gHint.style.opacity = 0, 700);
    }

    function showUI() {
        if (isLocked || isTyping) return;
        ui.classList.remove('ui-hidden');
        clearTimeout(hideTimer);
    }

    /* ---------- شريط التقدم: سحب باللمس/الفأرة + معاينة الإطار ---------- */
    const bufFill = document.createElement('div'); bufFill.id = 'bufFill';
    seekWrapper.querySelector('.seek-bar').insertBefore(bufFill, progFill);
    const pvBox = document.createElement('div'); pvBox.id = 'pvBox';
    pvBox.innerHTML = '<canvas id="pvCanvas" width="176" height="99"></canvas><span id="pvTime">00:00</span>';
    seekWrapper.appendChild(pvBox);
    const pvCanvas = $('pvCanvas'), pvTime = $('pvTime');
    const pv = document.createElement('video'); // فيديو خفي لاستخراج الإطارات فقط
    pv.muted = true; pv.playsInline = true; pv.preload = 'auto';
    let pvBusy = false, pvPending = null;

    function reqPv(t) {
        if (pvBusy) { pvPending = t; return; }
        pvBusy = true; pv.currentTime = t;
        setTimeout(() => { pvBusy = false; }, 1500); // أمان لو لم يصل seeked
    }
    pv.addEventListener('seeked', () => {
        try {
            pvCanvas.height = Math.round(pvCanvas.width * ((pv.videoHeight / pv.videoWidth) || 9 / 16));
            pvCanvas.getContext('2d').drawImage(pv, 0, 0, pvCanvas.width, pvCanvas.height);
        } catch (e) {}
        pvBusy = false;
        if (pvPending != null) { const t = pvPending; pvPending = null; reqPv(t); }
    });
    video.addEventListener('loadedmetadata', () => {
        if (pv.src !== video.currentSrc) pv.src = video.currentSrc;
    });

    function seekRatio(e) {
        const r = seekWrapper.firstElementChild.getBoundingClientRect();
        return clamp((e.clientX - r.left) / r.width, 0, 1);
    }
    function previewAt(p) {
        if (!video.duration) return;
        const w = seekWrapper.clientWidth, t = p * video.duration;
        pvBox.style.left = clamp(8 + p * (w - 16), 90, w - 90) + 'px';
        pvTime.textContent = formatTime(t);
        pvBox.classList.add('show');
        progFill.style.width = (p * 100) + '%';
        $('currentTime').innerText = formatTime(t);
        reqPv(t);
    }
    seekWrapper.addEventListener('pointerdown', e => {
        if (!video.duration) return;
        dragging = true; dragPos = seekRatio(e);
        seekWrapper.classList.add('drag');
        seekWrapper.setPointerCapture(e.pointerId);
        clearTimeout(hideTimer);
        previewAt(dragPos);
    });
    seekWrapper.addEventListener('pointermove', e => {
        if (dragging) { dragPos = seekRatio(e); previewAt(dragPos); }
        else if (e.pointerType === 'mouse') previewAt(seekRatio(e)); // معاينة عند تمرير الفأرة
    });
    const endDrag = commit => {
        if (!dragging) return;
        dragging = false; seekWrapper.classList.remove('drag');
        pvBox.classList.remove('show');
        if (commit && video.duration) video.currentTime = dragPos * video.duration;
        showUI();
    };
    seekWrapper.addEventListener('pointerup', () => endDrag(true));
    seekWrapper.addEventListener('pointercancel', () => endDrag(false));
    seekWrapper.addEventListener('pointerleave', e => { if (!dragging) { pvBox.classList.remove('show'); } });

    video.addEventListener('timeupdate', () => {
        const d = video.duration;
        if (!d || !isFinite(d)) return;
        if (!dragging) {
            progFill.style.width = (video.currentTime / d * 100) + '%';
            $('currentTime').innerText = formatTime(video.currentTime);
        }
        $('durationTime').innerText = formatTime(d);
        savePos();
    });
    video.addEventListener('progress', () => {
        const b = video.buffered, t = video.currentTime;
        for (let i = 0; i < b.length; i++) {
            if (b.start(i) <= t + 0.5 && b.end(i) >= t) { bufFill.style.width = (b.end(i) / video.duration * 100) + '%'; break; }
        }
    });

    /* ---------- إيماءات الشاشة ---------- */
    let tapT = 0, tapTimer, lpTimer, lpOn = false, prevRate = 1, st = null;
    gestures.addEventListener('pointerdown', e => {
        gestures.setPointerCapture(e.pointerId);
        st = { x: e.clientX, y: e.clientY, ct: video.currentTime, br: manualFilters.brightness, vol: video.volume, mode: null, target: 0 };
        lpTimer = setTimeout(() => {
            if (!st || st.mode || video.paused) return;
            lpOn = true; prevRate = video.playbackRate; video.playbackRate = 2; hint('⏩ 2×', true);
        }, 450);
    });
    gestures.addEventListener('pointermove', e => {
        if (!st) return;
        const dx = e.clientX - st.x, dy = e.clientY - st.y, W = innerWidth, H = innerHeight;
        if (!st.mode && Math.hypot(dx, dy) > 16 && !lpOn) {
            st.mode = Math.abs(dx) > Math.abs(dy) ? 'seek' : (st.x < W / 2 ? 'bri' : 'vol');
            clearTimeout(lpTimer);
        }
        if (st.mode === 'seek' && video.duration) {
            st.target = clamp(st.ct + dx / W * 90, 0, video.duration);
            const diff = Math.round(st.target - st.ct);
            hint(`${formatTime(st.target)}  (${diff >= 0 ? '+' : ''}${diff}s)`, true);
        } else if (st.mode === 'bri') {
            const v = Math.round(clamp(st.br - dy / H * 150, 50, 200));
            $('adjust-brightness').value = v; updateManualFilter('brightness', v);
            hint('☀ ' + v + '%', true);
        } else if (st.mode === 'vol') {
            video.volume = clamp(st.vol - dy / H * 1.3, 0, 1); video.muted = false;
            hint('🔊 ' + Math.round(video.volume * 100) + '%', true);
        }
    });
    gestures.addEventListener('pointerup', e => {
        clearTimeout(lpTimer);
        if (!st) return;
        const s = st; st = null;
        if (lpOn) { lpOn = false; video.playbackRate = prevRate; hint('', false); gHint.style.opacity = 0; return; }
        if (s.mode === 'seek') { video.currentTime = s.target; hint('', false); gHint.style.opacity = 0; return; }
        if (s.mode) { hint('', false); gHint.style.opacity = 0; return; }
        // نقرة
        const now = Date.now(), x = e.clientX / innerWidth, mouse = e.pointerType === 'mouse';
        if (now - tapT < 300) {
            clearTimeout(tapTimer); tapT = 0;
            if (mouse) requestFullScreen();
            else if (x < .33) { skip(-10); hint('⏪ −10s'); }
            else if (x > .66) { skip(10); hint('+10s ⏩'); }
            else togglePlay();
        } else {
            tapT = now;
            tapTimer = setTimeout(() => {
                tapT = 0;
                if (filtersPanel.classList.contains('active')) { filtersPanel.classList.remove('active'); return; }
                if (ui.classList.contains('ui-hidden')) showUI();
                else ui.classList.add('ui-hidden');
            }, 300);
        }
    });
    gestures.addEventListener('pointercancel', () => { clearTimeout(lpTimer); if (lpOn) video.playbackRate = prevRate; lpOn = false; st = null; });

    /* ---------- تشغيل/إيقاف + قفل الشاشة (مع زر فك القفل) ---------- */
    video.addEventListener('play', () => $('playBtnSmall').innerHTML = '<i class="fas fa-pause"></i>');
    video.addEventListener('pause', () => { $('playBtnSmall').innerHTML = '<i class="fas fa-play"></i>'; showUI(); });

    const unlockBtn = document.createElement('button');
    unlockBtn.className = 'unlock-btn hidden';
    unlockBtn.innerHTML = '<i class="fas fa-lock-open"></i> فك القفل';
    unlockBtn.onclick = () => toggleLock();
    playerBox.appendChild(unlockBtn);
    let unlockTimer;
    function flashLockHint() {
        unlockBtn.classList.remove('hidden');
        clearTimeout(unlockTimer);
        unlockTimer = setTimeout(() => unlockBtn.classList.add('hidden'), 2500);
    }
    function toggleLock() {
        isLocked = !isLocked;
        $('lockIcon').className = isLocked ? 'fas fa-lock text-orange-500' : 'fas fa-unlock';
        unlockBtn.classList.add('hidden');
        if (isLocked) {
            ui.classList.add('ui-hidden'); lockShield.classList.remove('hidden');
            filtersPanel.classList.remove('active'); showNotification('الشاشة مقفلة — المس الشاشة لإظهار زر فك القفل');
        } else { lockShield.classList.add('hidden'); showUI(); }
    }

    /* ---------- تحميل الرابط مع بديل تلقائي عند مشاكل CORS ---------- */
    function updateSource() {
        const url = urlInput.value.trim();
        if (!url || url.startsWith('ملف محلي:')) return;
        triedNoCors = false;
        video.crossOrigin = 'anonymous'; // يسمح بالتقاط الإطارات؛ إن فشل نعيد التحميل بدونه
        video.src = url; video.load();
        video.play().catch(() => {});
        showUI();
    }
    video.addEventListener('error', () => {
        const s = video.getAttribute('src');
        if (!s) return;
        if (video.crossOrigin && !triedNoCors && !s.startsWith('blob:')) {
            triedNoCors = true; video.removeAttribute('crossorigin');
            video.src = s; video.load(); video.play().catch(() => {});
            return;
        }
        spinner.style.display = 'none';
        showNotification('تعذّر تشغيل الفيديو. تحقق من الرابط أو صيغة الملف.');
    });

    /* ---------- مؤشر تحميل + مراقب تجمّد تدريجي ---------- */
    ['waiting', 'seeking', 'loadstart'].forEach(ev => video.addEventListener(ev, () => spinner.style.display = 'block'));
    ['playing', 'canplay', 'seeked', 'pause', 'emptied'].forEach(ev => video.addEventListener(ev, () => { if (video.readyState >= 3 || video.paused) spinner.style.display = 'none'; }));
    let lastT = -1, stuck = 0, stage = 0;
    setInterval(() => {
        if (video.paused || video.ended || dragging || video.seeking || !video.currentSrc) { stuck = 0; stage = 0; return; }
        if (Math.abs(video.currentTime - lastT) < 0.01) {
            if (++stuck >= 5) {
                stuck = 0;
                const t = video.currentTime;
                if (stage === 0) { stage = 1; video.currentTime = Math.min(video.duration, t + 0.2); video.play().catch(() => {}); }
                else { // حل أقوى: إعادة تحميل المصدر والعودة لنفس الموضع
                    stage = 0; const src = video.currentSrc;
                    video.src = src; video.load();
                    video.addEventListener('loadedmetadata', () => { video.currentTime = t; video.play().catch(() => {}); }, { once: true });
                    showNotification('تمت إعادة الاتصال بالفيديو تلقائياً');
                }
            }
        } else { stuck = 0; stage = 0; }
        lastT = video.currentTime;
    }, 1000);

    /* ---------- استئناف من آخر موضع ---------- */
    let lastSave = 0;
    const posKey = () => 'vlcpos:' + urlInput.value;
    function savePos() {
        if (Math.abs(video.currentTime - lastSave) < 5) return;
        lastSave = video.currentTime;
        try { localStorage.setItem(posKey(), String(Math.floor(video.currentTime))); } catch (e) {}
    }
    video.addEventListener('loadedmetadata', () => {
        pvBox.classList.remove('show'); bufFill.style.width = '0'; window.detectedFps = null; fpsSamples.length = 0;
        try {
            const p = parseFloat(localStorage.getItem(posKey()));
            if (p > 5 && p < video.duration - 10) { video.currentTime = p; showNotification('تم الاستئناف من ' + formatTime(p)); }
        } catch (e) {}
    });
    video.addEventListener('ended', () => { try { localStorage.removeItem(posKey()); } catch (e) {} });

    /* ---------- اكتشاف معدل الإطارات الحقيقي لخطوة الإطار ---------- */
    const fpsSamples = []; let lastMT = null;
    if ('requestVideoFrameCallback' in video) {
        const cb = (now, m) => {
            if (lastMT !== null && !video.paused && video.playbackRate === 1) {
                const dt = m.mediaTime - lastMT;
                if (dt > 0 && dt < 0.2) {
                    fpsSamples.push(dt); if (fpsSamples.length > 40) fpsSamples.shift();
                    if (fpsSamples.length >= 20) window.detectedFps = Math.round(1 / [...fpsSamples].sort((a, b) => a - b)[fpsSamples.length >> 1]);
                }
            }
            lastMT = m.mediaTime; video.requestVideoFrameCallback(cb);
        };
        video.requestVideoFrameCallback(cb);
    }

    /* ---------- الصوت والتكرار ---------- */
    
    function toggleMute() { video.muted = !video.muted; }
    function toggleLoop() { video.loop = !video.loop; $('loopBtn').classList.toggle('ctl-on', video.loop); hint(video.loop ? 'التكرار: مفعّل' : 'التكرار: متوقف'); }
    $('muteBtn').onclick = toggleMute; $('loopBtn').onclick = toggleLoop;
    $('volRange').oninput = e => { video.volume = +e.target.value; video.muted = false; };
    video.addEventListener('volumechange', () => {
        $('muteBtn').innerHTML = '<i class="fas ' + (video.muted || !video.volume ? 'fa-volume-xmark' : 'fa-volume-high') + '"></i>';
        $('volRange').value = video.muted ? 0 : video.volume;
    });

    /* ---------- شاشة مستيقظة + تحكم من إشعارات النظام ---------- */
    let wake = null;
    async function wakeSet(on) {
        try { if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (wake) { await wake.release(); wake = null; } } catch (e) {}
    }
    video.addEventListener('play', () => wakeSet(true));
    video.addEventListener('pause', () => wakeSet(false));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !video.paused) wakeSet(true); });
    if ('mediaSession' in navigator) {
        const ms = navigator.mediaSession;
        ms.setActionHandler('play', () => video.play());
        ms.setActionHandler('pause', () => video.pause());
        ms.setActionHandler('seekbackward', () => skip(-10));
        ms.setActionHandler('seekforward', () => skip(10));
        video.addEventListener('loadedmetadata', () => { ms.metadata = new MediaMetadata({ title: decodeURIComponent((urlInput.value.split('/').pop() || 'VLC Ultimate Pro')) }); });
    }

    /* ---------- اختصارات لوحة المفاتيح ---------- */
    window.onkeydown = e => {
        if (document.activeElement === urlInput) return;
        const k = e.code;
        if (k === 'Space' || k === 'KeyK') { e.preventDefault(); togglePlay(); }
        else if (k === 'KeyF') requestFullScreen();
        else if (k === 'KeyP') togglePIP();
        else if (k === 'ArrowRight') { skip(e.shiftKey ? 30 : 10); hint('+' + (e.shiftKey ? 30 : 10) + 's'); }
        else if (k === 'ArrowLeft') { skip(e.shiftKey ? -30 : -10); hint('−' + (e.shiftKey ? 30 : 10) + 's'); }
        else if (k === 'ArrowUp') { e.preventDefault(); video.volume = clamp(video.volume + .05, 0, 1); hint('🔊 ' + Math.round(video.volume * 100) + '%'); }
        else if (k === 'ArrowDown') { e.preventDefault(); video.volume = clamp(video.volume - .05, 0, 1); hint('🔊 ' + Math.round(video.volume * 100) + '%'); }
        else if (k === 'KeyM') toggleMute();
        else if (k === 'KeyL') toggleLoop();
        else if (k === 'Comma' || k === 'BracketLeft') stepFrame(-1);
        else if (k === 'Period' || k === 'BracketRight') stepFrame(1);
        else if (k === 'KeyS') captureCurrentFrame();
        else if (k === 'KeyG') toggleFiltersPanel();
        else if (/^Digit[0-9]$/.test(k) && video.duration) { video.currentTime = video.duration * (+k[5] / 10); }
    };

</script>
</body>
